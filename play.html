<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play – Hanglet</title>
  <meta name="description" content="Play Hanglet: guess the word one letter at a time before the drawing is finished.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Play Hanglet">
  <meta property="og:description" content="Guess the word one letter at a time. Daily challenge, levels, Time Attack and more.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/play.js"></script>
</head>
<body class="page-play">
  <main id="main" class="container play-page">

    <!-- Title bar with back button and hint -->
    <div class="play-top">
      <a class="icon-button" href="index.html" aria-label="Back to home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="play-title">
        <h1 id="mode-title">Hanglet</h1>
        <p id="mode-subtitle"></p>
      </div>
      <button class="hint-button" id="hint-button" type="button" hidden></button>
    </div>

    <!-- Options before a game, or the Daily summary -->
    <section class="setup card" id="setup" hidden></section>

    <!-- The game board -->
    <section class="board" id="board" hidden aria-label="Game board">
      <div class="board-status">
        <span class="chip" id="category-chip"></span>
        <div id="status-area"></div>
        <div class="lives" id="lives" role="img"></div>
      </div>
      <div class="board-main">
        <div class="hangman-box" id="hangman"></div>
        <div class="board-play">
          <div class="word" id="word" role="img"></div>
          <div class="keyboard" id="keyboard" role="group" aria-label="Letters"></div>
        </div>
      </div>
    </section>

    <!-- Screen reader messages -->
    <div class="visually-hidden" id="announcer" aria-live="assertive"></div>

    <noscript><p>Hanglet needs JavaScript to run.</p></noscript>
  </main>

  <!-- Win / lose screen, filled by js/pages/play.js -->
  <dialog class="dialog result" id="result-dialog" aria-labelledby="result-title"></dialog>
</body>
</html>
