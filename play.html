<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play – Hanglet</title>
  <meta name="description" content="Play Hanglet: read Tilo's clues and find the word. The riddle gets clearer with every mistake.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Play – Hanglet">
  <meta property="og:description" content="Play Hanglet: read Tilo's clues and find the word. The riddle gets clearer with every mistake.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/figures.css">
  <link rel="stylesheet" href="css/game.css">

  <!-- Visitor statistics (GoatCounter) are set up in js/analytics.js -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/play.js"></script>
</head>
<body class="page-play">
  <main id="main" class="container play-page">

    <div class="play-top">
      <a class="icon-button" id="back-link" href="index.html" data-i18n-attr="aria-label: common.backHome"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="play-title">
        <h1 id="mode-title">Hanglet</h1>
        <p id="mode-subtitle"></p>
      </div>
      <button class="icon-button music-button" id="music-button" type="button" aria-pressed="false" data-i18n-attr="aria-label: music.label"></button>
      <button class="hint-button" id="help-button" type="button" hidden></button>
    </div>

    <section class="setup card" id="setup" hidden></section>

    <section class="board" id="board" hidden data-i18n-attr="aria-label: play.board">
      <div class="board-status">
        <span class="chip chip-category" id="category-chip"></span>
        <div id="status-area"></div>
        <div class="lives" id="lives" role="img"></div>
      </div>
      <div class="board-main">
        <div class="stage-card clue-stage" id="stage-card">
          <div class="figure-stage">
            <div class="figure-box" id="figure"></div>
            <div class="stage-mascot" id="stage-mascot"></div>
          </div>
          <div class="clue-panel" id="clue-panel">
            <p class="clue-worth" id="clue-worth"></p>
            <ol class="clue-list" id="clue-list" aria-live="polite" data-i18n-attr="aria-label: play.cluesLabel"></ol>
            <p class="tilo-says" id="tilo-says" aria-hidden="true"></p>
          </div>
          <div class="combo-area" id="combo" aria-hidden="true"></div>
        </div>
        <div class="word" id="word" role="img"></div>
        <div class="know-area">
          <button class="button button-sun know-button" id="know-button" type="button"></button>
          <form class="guess-form" id="guess-form" hidden>
            <label class="field-label" for="guess-input" data-i18n="play.guessLabel"></label>
            <div class="guess-row">
              <input type="text" id="guess-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="guess-note">
              <button class="button button-primary" type="submit" data-i18n="play.check"></button>
              <button class="button button-secondary" id="guess-cancel" type="button" data-i18n="common.cancel"></button>
            </div>
            <p class="guess-note" id="guess-note" aria-live="polite"></p>
          </form>
        </div>
        <div class="keyboard" id="keyboard" role="group" data-i18n-attr="aria-label: keyboard.label"></div>
      </div>
    </section>

    <div class="visually-hidden" id="announcer" aria-live="assertive"></div>
    <noscript><p>Hanglet needs JavaScript to run.</p></noscript>
  </main>

  <dialog class="dialog result" id="result-dialog" aria-labelledby="result-title"></dialog>
</body>
</html>
