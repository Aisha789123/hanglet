<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Statistics – Hanglet</title>
  <meta name="description" content="Your Hanglet statistics: games played, win rate, streaks, a calendar of your Daily games and all your badges.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Statistics – Hanglet">
  <meta property="og:description" content="Your Hanglet statistics: games played, win rate, streaks, a calendar of your Daily games and all your badges.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/stats.js"></script>
</head>
<body class="page-stats">
  <main id="main" class="container">
    <h1 class="page-title">Statistics</h1>
    <p class="page-intro">Everything you have done so far. Saved on this device only.</p>

    <div class="stats-layout">
      <section class="card stats-wide" aria-labelledby="overview-title">
        <h2 class="visually-hidden" id="overview-title">Overview</h2>
        <div class="stat-tiles" id="stat-tiles"></div>
      </section>

      <section class="card" aria-labelledby="chart-title">
        <div class="card-header"><h2 id="chart-title">Misses per game</h2></div>
        <div class="bar-chart" id="misses-chart" role="img"></div>
      </section>

      <section class="card" aria-labelledby="progress-title">
        <div class="card-header"><h2 id="progress-title">Progress</h2></div>
        <ul class="progress-list" id="progress-list"></ul>
      </section>

      <section class="card" aria-labelledby="calendar-title">
        <div class="card-header">
          <h2 id="calendar-title">Daily calendar</h2>
          <div class="calendar-nav">
            <button class="icon-button" id="calendar-prev" type="button" aria-label="Previous month"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <span id="calendar-month" aria-live="polite"></span>
            <button class="icon-button" id="calendar-next" type="button" aria-label="Next month"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="legend" aria-hidden="true">
          <span><i class="legend-perfect"></i>All solved</span>
          <span><i class="legend-played"></i>Some solved</span>
          <span><i class="legend-missed"></i>None solved</span>
        </div>
      </section>

      <section class="card stats-wide" aria-labelledby="badges-title">
        <div class="card-header"><h2 id="badges-title">Badges</h2><span class="chip" id="badge-count"></span></div>
        <ul class="badges" id="badges"></ul>
      </section>
    </div>
  </main>
</body>
</html>
