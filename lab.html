<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanglet Lab</title>
  <meta name="description" content="Test page for a new Hanglet idea: the riddle gets clearer.">
  <meta name="theme-color" content="#f6f7f9">
  <!-- Test page: keep it out of search engines -->
  <meta name="robots" content="noindex">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/figures.css">
  <link rel="stylesheet" href="css/game.css">

  <!-- Styles only for this test page, so the real game CSS stays the same -->
  <style>
    .lab-total {
      margin-left: auto;
      font-family: var(--font-display);
      font-weight: 700;
      white-space: nowrap;
    }

    .lab-worth {
      font-weight: 800;
      font-size: var(--text-sm);
    }

    .lab-worth-stars {
      letter-spacing: 2px;
    }

    .lab-stage {
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: start;
    }

    .lab-mascot {
      width: 72px;
      height: 80px;
    }

    .lab-clues {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .lab-clue {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 8px 10px;
      border-radius: 16px;
      background: var(--surface-2);
    }

    .lab-clue-number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--surface-3);
      color: var(--text);
      font-family: var(--font-display);
      font-weight: 700;
    }

    .lab-clue-number .icon {
      width: 16px;
      height: 16px;
    }

    .lab-clue.is-open .lab-clue-number {
      background: var(--c-sun);
      color: var(--c-ink);
    }

    .lab-clue-body {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .lab-clue-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .lab-clue-text {
      font-family: var(--font-display);
      font-weight: 600;
      line-height: 1.25;
    }

    /* The newest open clue is the big one */
    .lab-clue.is-current {
      background: var(--accent-soft);
      animation: pop-in 400ms var(--ease) both;
    }

    .lab-clue.is-current .lab-clue-text {
      font-size: clamp(1.1rem, 4.6vw, 1.5rem);
    }

    .lab-clue.is-locked .lab-clue-text {
      color: var(--text-muted);
      font-family: var(--font);
      font-size: var(--text-sm);
      font-weight: 700;
    }

    .lab-actions {
      display: grid;
      justify-items: center;
    }

    .lab-guess {
      display: grid;
      gap: 8px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .lab-guess-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lab-guess-row input {
      flex: 1 1 180px;
      min-width: 0;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .lab-guess-note {
      color: var(--text-muted);
      font-size: var(--text-sm);
      font-weight: 700;
    }

    .lab-guess-note.is-warning {
      color: var(--danger);
    }

    .lab-stars,
    .lab-share-line {
      font-size: 1.75rem;
      text-align: center;
      letter-spacing: 2px;
    }

    .lab-share-line {
      font-size: clamp(1.1rem, 5vw, 1.6rem);
      line-height: 1.6;
    }

    .lab-clues-title {
      margin-top: 12px;
      font-weight: 800;
    }

    .lab-clue-list {
      display: grid;
      gap: 6px;
      padding-left: 0;
      list-style: none;
      text-align: left;
    }

    .lab-clue-list li {
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--surface-2);
    }

    .lab-clue-list li.is-solved-here {
      background: var(--c-sun);
      color: var(--c-ink);
    }

    @media (min-width: 700px) {
      .lab-stage {
        grid-template-columns: 110px minmax(0, 1fr);
      }

      .lab-mascot {
        width: 110px;
        height: 120px;
      }
    }
  </style>

  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/lab.js"></script>
</head>
<body class="page-play page-lab">
  <main id="main" class="container play-page">

    <div class="play-top">
      <a class="icon-button" href="index.html" data-i18n-attr="aria-label: common.backHome"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="play-title">
        <h1 id="lab-title">Hanglet Lab</h1>
        <p id="lab-subtitle"></p>
      </div>
      <span class="chip lab-total" id="lab-total" role="status"></span>
    </div>

    <section class="board" id="board" hidden>
      <div class="board-status">
        <span class="lab-worth" id="lab-worth"></span>
        <div class="lives" id="lives" role="img"></div>
      </div>
      <div class="board-main">
        <div class="stage-card lab-stage">
          <div class="lab-mascot" id="lab-mascot"></div>
          <div>
            <ol class="lab-clues" id="lab-clues" aria-live="polite"></ol>
            <p class="tilo-says" id="tilo-says" aria-hidden="true"></p>
          </div>
          <div class="combo-area" id="combo" aria-hidden="true"></div>
        </div>
        <div class="word" id="word" role="img"></div>
        <div class="lab-actions">
          <button class="button button-sun" id="know-button" type="button"></button>
          <form class="lab-guess" id="guess-form" hidden>
            <label class="field-label" id="guess-label" for="guess-input"></label>
            <div class="lab-guess-row">
              <input type="text" id="guess-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="guess-note">
              <button class="button button-primary" id="guess-check" type="submit"></button>
              <button class="button button-secondary" id="guess-cancel" type="button"></button>
            </div>
            <p class="lab-guess-note" id="guess-note" aria-live="polite"></p>
          </form>
        </div>
        <div class="keyboard" id="keyboard" role="group" data-i18n-attr="aria-label: keyboard.label"></div>
      </div>
    </section>

    <div class="visually-hidden" id="announcer" aria-live="assertive"></div>
    <noscript><p>Hanglet needs JavaScript to run.</p></noscript>
  </main>

  <dialog class="dialog result" id="result-dialog" aria-labelledby="result-title"></dialog>
</body>
</html>
