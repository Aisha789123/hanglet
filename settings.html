<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings – Hanglet</title>
  <meta name="description" content="Change the Hanglet language, colors, figure and text size, turn on high contrast, sound and vibration, or reset your progress.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Settings – Hanglet">
  <meta property="og:description" content="Change the Hanglet language, colors, figure and text size, turn on high contrast, sound and vibration, or reset your progress.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/figures.css">
  <link rel="stylesheet" href="css/game.css">

  <!-- Visitor statistics (GoatCounter) are set up in js/analytics.js -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/settings.js"></script>
</head>
<body class="page-settings">
  <main id="main" class="container">
    <h1 class="page-title" data-i18n="settings.title"></h1>
    <p class="page-intro" data-i18n="settings.intro"></p>

    <div class="settings-layout">
      <section class="card" aria-labelledby="language-title">
        <div class="card-header"><h2 id="language-title" data-i18n="settings.language"></h2></div>
        <form id="language-choice">
          <fieldset class="option-group">
            <legend class="visually-hidden" data-i18n="settings.language"></legend>
            <div class="segments">
              <label class="segment"><input type="radio" name="language" value="en"><span lang="en"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>English</span></label>
              <label class="segment"><input type="radio" name="language" value="nl"><span lang="nl"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Nederlands</span></label>
            </div>
          </fieldset>
        </form>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>
          <span class="setting-text"><strong data-i18n="settings.kidsFirst"></strong><span data-i18n="settings.kidsFirstHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="kids-first-switch">
        </label>
      </section>

      <section class="card" aria-labelledby="look-title">
        <div class="card-header"><h2 id="look-title" data-i18n="settings.appearance"></h2></div>
        <form id="color-mode">
          <fieldset class="option-group">
            <legend data-i18n="settings.colorMode"></legend>
            <div class="segments">
              <label class="segment"><input type="radio" name="color-mode" value="system"><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span data-i18n="settings.system"></span></span></label>
              <label class="segment"><input type="radio" name="color-mode" value="light"><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="settings.light"></span></span></label>
              <label class="segment"><input type="radio" name="color-mode" value="dark"><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span data-i18n="settings.dark"></span></span></label>
            </div>
          </fieldset>
        </form>
        <h3 class="subheading" data-i18n="settings.themes"></h3>
        <p class="muted card-text" data-i18n="settings.themesHelp"></p>
        <ul class="theme-list" id="theme-list"></ul>
      </section>

      <section class="card" aria-labelledby="access-title">
        <div class="card-header"><h2 id="access-title" data-i18n="settings.accessibility"></h2></div>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18L9 6l5 12M5.8 14h6.4M15 18l3-7 3 7M15.9 16h4.2"/></svg>
          <span class="setting-text"><strong data-i18n="settings.largeText"></strong><span data-i18n="settings.largeTextHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="large-text-switch">
        </label>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg>
          <span class="setting-text"><strong data-i18n="settings.highContrast"></strong><span data-i18n="settings.highContrastHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="contrast-switch">
        </label>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
          <span class="setting-text"><strong data-i18n="settings.reduceMotion"></strong><span data-i18n="settings.reduceMotionHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="motion-switch">
        </label>
      </section>

      <section class="card" aria-labelledby="figures-title">
        <div class="card-header"><h2 id="figures-title" data-i18n="settings.figures"></h2></div>
        <p class="muted card-text" data-i18n="settings.figuresHelp"></p>
        <ul class="figure-list" id="figure-list"></ul>
      </section>

      <section class="card" aria-labelledby="feel-title">
        <div class="card-header"><h2 id="feel-title" data-i18n="settings.soundAndFeel"></h2></div>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <span class="setting-text"><strong data-i18n="settings.sound"></strong><span data-i18n="settings.soundHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="sound-switch">
        </label>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          <span class="setting-text"><strong data-i18n="settings.music"></strong><span data-i18n="settings.musicHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="music-switch">
        </label>
        <label class="setting-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/></svg>
          <span class="setting-text"><strong data-i18n="settings.vibration"></strong><span id="vibration-note" data-i18n="settings.vibrationHelp"></span></span>
          <input class="switch" type="checkbox" role="switch" id="vibration-switch">
        </label>
      </section>

      <section class="card" aria-labelledby="help-title">
        <div class="card-header"><h2 id="help-title" data-i18n="settings.help"></h2></div>
        <div class="dialog-actions actions-start">
          <button class="button button-secondary" id="tutorial-button" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-i18n="settings.replayTutorial"></span></button>
          <button class="button button-secondary" id="install-button" type="button" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i18n="settings.install"></span></button>
        </div>
      </section>

      <section class="card" aria-labelledby="data-title">
        <div class="card-header"><h2 id="data-title" data-i18n="settings.data"></h2></div>
        <p class="muted" data-i18n="settings.dataHelp"></p>
        <div class="dialog-actions actions-start">
          <button class="button button-danger" id="reset-button" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span data-i18n="settings.reset"></span></button>
        </div>
      </section>
    </div>
  </main>

  <dialog class="dialog" id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title" data-i18n="settings.resetTitle"></h2>
    <p data-i18n="settings.resetText"></p>
    <div class="dialog-actions">
      <button class="button button-secondary" id="reset-cancel" type="button" data-i18n="common.cancel"></button>
      <button class="button button-danger" id="reset-confirm" type="button" data-i18n="settings.resetConfirm"></button>
    </div>
  </dialog>
</body>
</html>
