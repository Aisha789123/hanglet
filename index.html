<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanglet – A playful word game for every day</title>
  <meta name="description" content="Guess the word letter by letter with Tilo. Daily challenge, 40 levels, Time Attack, Kids mode and challenges for friends. Free, in English and Dutch.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Hanglet – A playful word game for every day">
  <meta property="og:description" content="Guess the word letter by letter with Tilo. Daily challenge, 40 levels, Time Attack, Kids mode and challenges for friends. Free, in English and Dutch.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/figures.css">
  <link rel="stylesheet" href="css/game.css">

  <!-- Visitor statistics (GoatCounter) are set up in js/analytics.js -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/home.js"></script>
</head>
<body class="page-home">
  <main id="main" class="container home">

    <section class="hero-card" aria-labelledby="hero-title">
      <div class="hero-mascot">
        <p class="speech" id="hero-speech" aria-live="polite"></p>
        <div class="mascot-big" id="hero-mascot"></div>
      </div>
      <div class="hero-content">
        <div class="word-drop" id="word-drop" aria-hidden="true"></div>
        <h1 id="hero-title" data-i18n="home.title">Guess the word, one letter at a time.</h1>
        <p class="hero-intro" data-i18n="home.intro"></p>
        <a class="button button-play" id="play-button" href="play.html?mode=daily">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span data-i18n="home.play">Play</span>
        </a>
        <p class="play-sub" id="play-sub"></p>
      </div>
    </section>

    <section class="daily-card" aria-labelledby="daily-title">
      <div class="daily-rings" id="daily-rings"></div>
      <div class="daily-info">
        <p class="eyebrow" id="daily-number"></p>
        <h2 id="daily-title" data-i18n="home.dailyTitle"></h2>
        <p id="daily-status"></p>
        <p class="daily-countdown"><span data-i18n="home.newWordsIn"></span> <strong class="countdown" id="daily-countdown">--:--:--</strong></p>
      </div>
      <a class="button button-sun" id="daily-cta" href="play.html?mode=daily"><span data-i18n="home.playDaily"></span></a>
    </section>

    <div class="home-rewards" id="home-rewards"></div>

    <section aria-labelledby="modes-title">
      <h2 class="section-title" id="modes-title" data-i18n="home.chooseMode"></h2>
      <div class="mode-tiles" id="mode-tiles"></div>
    </section>

    <section class="home-bottom">
      <div class="card player-card" id="player-card" data-i18n-attr="aria-label: home.progressLabel"></div>
      <div class="card teaser-card" aria-labelledby="dictionary-title">
        <div class="teaser-icon tone-teal"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M19 19v2H6"/></svg></div>
        <div class="teaser-body">
          <h2 class="section-title" id="dictionary-title" data-i18n="home.dictionaryTitle"></h2>
          <div id="dictionary-teaser"></div>
        </div>
        <a class="button button-secondary" href="dictionary.html" data-i18n="home.openDictionary"></a>
      </div>
    </section>

    <section class="card install-card">
      <div>
        <h2 class="section-title install-title" data-i18n="home.offlineTitle"></h2>
        <p data-i18n="home.offlineText"></p>
      </div>
      <button class="button button-secondary" id="install-button" type="button" hidden data-i18n="settings.install"></button>
    </section>

  </main>
</body>
</html>
