<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanglet – A word game for every day</title>
  <meta name="description" content="Hanglet is a free word guessing game for all ages, in English and Dutch. Solve the Daily, play Classic, climb 40 levels, race the clock or play the Kids mode. Works offline.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Hanglet – A word game for every day">
  <meta property="og:description" content="Hanglet is a free word guessing game for all ages, in English and Dutch. Solve the Daily, play Classic, climb 40 levels, race the clock or play the Kids mode. Works offline.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/figures.css">

  <!-- Visitor statistics (GoatCounter) are set up in js/analytics.js -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/home.js"></script>
</head>
<body class="page-home">
  <main id="main" class="container">

    <section class="hero">
      <div>
        <span class="hero-logo" id="hero-logo"></span>
        <h1 data-i18n="home.title">Guess the word, one letter at a time.</h1>
        <p data-i18n="home.intro"></p>
        <div class="hero-actions">
          <a class="button button-primary button-large" href="play.html?mode=daily" id="daily-cta"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span data-i18n="home.playDaily"></span></a>
          <a class="button button-secondary button-large" href="how-to-play.html" data-i18n="nav.howToPlay"></a>
        </div>
      </div>
      <div class="card player-card" id="player-card" data-i18n-attr="aria-label: home.progressLabel"></div>
    </section>

    <section aria-labelledby="modes-title">
      <h2 class="section-title" id="modes-title" data-i18n="home.chooseMode"></h2>
      <div class="mode-grid">
        <a class="mode-card tone-blue is-featured" href="play.html?mode=daily">
          <span class="mode-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <span>
            <h3 data-i18n="modes.daily.title"></h3>
            <p data-i18n="modes.daily.text"></p>
            <span class="mode-status" id="daily-status"></span>
          </span>
          <svg class="icon mode-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="mode-card tone-green" href="play.html?mode=classic">
          <span class="mode-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8c-2.2 0-4 1.8-4 4s1.8 4 4 4c3.5 0 6.5-8 10-8 2.2 0 4 1.8 4 4s-1.8 4-4 4c-3.5 0-6.5-8-10-8z"/></svg></span>
          <span>
            <h3 data-i18n="modes.classic.title"></h3>
            <p data-i18n="modes.classic.text"></p>
            <span class="mode-status" id="classic-status"></span>
          </span>
          <svg class="icon mode-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="mode-card tone-orange" href="levels.html">
          <span class="mode-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span>
          <span>
            <h3 data-i18n="modes.levels.title"></h3>
            <p data-i18n="modes.levels.text"></p>
            <span class="mode-status" id="levels-status"></span>
          </span>
          <svg class="icon mode-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="mode-card tone-pink" href="play.html?mode=timed">
          <span class="mode-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
          <span>
            <h3 data-i18n="modes.timed.title"></h3>
            <p data-i18n="modes.timed.text"></p>
            <span class="mode-status" id="timed-status"></span>
          </span>
          <svg class="icon mode-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="mode-card tone-yellow" href="play.html?mode=kids" id="kids-card">
          <span class="mode-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.5M15 9.5v.5"/></svg></span>
          <span>
            <h3 data-i18n="modes.kids.title"></h3>
            <p data-i18n="modes.kids.text"></p>
            <span class="mode-status" id="kids-status"></span>
          </span>
          <svg class="icon mode-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
    </section>

    <section class="card teaser-card" aria-labelledby="dictionary-title">
      <div class="teaser-icon tone-teal"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M19 19v2H6"/></svg></div>
      <div class="teaser-body">
        <h2 class="section-title" id="dictionary-title" data-i18n="home.dictionaryTitle"></h2>
        <div id="dictionary-teaser"></div>
      </div>
      <a class="button button-secondary" href="dictionary.html" data-i18n="home.openDictionary"></a>
    </section>

    <section aria-labelledby="steps-title">
      <h2 class="section-title" id="steps-title" data-i18n="home.howItWorks"></h2>
      <ol class="steps">
        <li class="step"><span class="step-number">1</span><div><h3 data-i18n="home.step1Title"></h3><p data-i18n="home.step1Text"></p></div></li>
        <li class="step"><span class="step-number">2</span><div><h3 data-i18n="home.step2Title"></h3><p data-i18n="home.step2Text"></p></div></li>
        <li class="step"><span class="step-number">3</span><div><h3 data-i18n="home.step3Title"></h3><p data-i18n="home.step3Text"></p></div></li>
      </ol>
    </section>

    <section class="card install-card">
      <div>
        <h2 class="section-title install-title" data-i18n="home.offlineTitle"></h2>
        <p data-i18n="home.offlineText"></p>
      </div>
      <button class="button button-secondary" id="install-button" type="button" hidden data-i18n="settings.install"></button>
    </section>

  </main>
</body>
</html>
