<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Tilo gives you a tricky clue, and every mistake makes the riddle clearer. Three new riddles every day, 40 levels and a Kids world for ages 6 to 9. Free, in English and Dutch.">
  <meta name="theme-color" content="#f6f7f9">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hanglet">
  <meta property="og:title" content="Hanglet – The riddle gets clearer">
  <meta property="og:description" content="Tilo gives you a tricky clue, and every mistake makes the riddle clearer. Three new riddles every day, 40 levels and a Kids world for ages 6 to 9. Free, in English and Dutch.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

</head>
<body class="page-home">
  <main id="main" class="container home">

    <section class="hero-card daily-hero" aria-labelledby="hero-title">
      <div class="hero-mascot">
        <p class="speech" id="hero-speech" aria-live="polite"></p>
        <div class="mascot-big" id="hero-mascot"></div>
      </div>
      <div class="hero-content">
        <p class="eyebrow hero-eyebrow" id="daily-number"></p>
        <h1 id="hero-title" data-i18n="home.title">Today's riddles</h1>
        <div class="daily-rings" id="daily-rings"></div>
        <p class="hero-status" id="daily-status"></p>
        <a class="button button-play" id="play-button" href="play.html?mode=daily">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span id="play-label">Play</span>
        </a>
        <p class="hero-countdown"><span data-i18n="home.newWordsIn"></span> <strong class="countdown" id="daily-countdown">--:--:--</strong></p>
      </div>
    </section>

    <section aria-labelledby="more-title">
      <h2 class="section-title" id="more-title" data-i18n="home.moreTitle"></h2>
      <div class="mode-tiles" id="mode-tiles"></div>
    </section>

    <section class="home-strip" id="home-strip" data-i18n-attr="aria-label: home.starsLabel"></section>

  </main>
</body>
</html>
